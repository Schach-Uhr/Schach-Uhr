<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Schachuhr</title>
<style>
  :root {
    --bg: #14161a;
    --panel-active: #2f9e5b;
    --panel-lost: #c0392b;
    --text: #e9ecef;
    --bar: #1b1e23;
    --accent: #4dabf7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    height: 100dvh;
    gap: 4px;
    padding: 4px;
    grid-template-areas: "p1" "bar" "p2";
    grid-template-rows: 1fr auto 1fr;
    user-select: none;
    overflow: hidden;
  }
  /* Querformat: Leiste oben, Uhren nebeneinander */
  @media (min-aspect-ratio: 1/1) {
    body {
      grid-template-areas: "bar bar" "p1 p2";
      grid-template-rows: auto 1fr;
      grid-template-columns: 1fr 1fr;
    }
  }
  /* Hochformat: obere Uhr umgedreht, damit man sich gegenübersitzen kann */
  @media (max-aspect-ratio: 1/1) {
    #p1 { transform: rotate(180deg); }
  }

  .panel {
    border: 6px solid transparent;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    font: inherit;
    transition: background .15s, opacity .15s, border-color .15s;
    min-height: 0;
  }
  #p1 { grid-area: p1; }
  #p2 { grid-area: p2; }
  .panel.white { background: #f1f3f5; color: #111; }
  .panel.black { background: #08090b; color: #f1f3f5; border-color: #2b3038; }
  .panel.active, .panel.won { border-color: var(--panel-active); box-shadow: 0 0 24px rgba(47, 158, 91, .6); }
  .panel.idle { opacity: .45; }
  .panel.lost { background: var(--panel-lost); color: #fff; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .6; } }
  .panel .name { font-size: clamp(14px, 2.5vmin, 22px); opacity: .8; letter-spacing: .08em; text-transform: uppercase; }
  .panel.won .name { opacity: 1; font-weight: 700; color: var(--panel-active); }
  .panel .time {
    font-size: clamp(56px, 19vmin, 220px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .panel .time.low { color: #ff3b30; text-shadow: 0 0 22px rgba(255, 59, 48, .85); }
  .panel.lost .time.low { color: #fff; text-shadow: none; }
  .panel .moves { font-size: clamp(13px, 2.2vmin, 18px); opacity: .7; }

  /* Schmale Leiste mit kleinen Symbol-Knöpfen */
  #bar {
    grid-area: bar;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 2px 0;
  }
  button.ctl {
    height: 34px;
    min-width: 34px;
    padding: 0 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: #2b3038;
    color: var(--text);
    border: 1px solid #3a414b;
    border-radius: 9px;
    font: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  button.ctl:hover { background: #343a44; }
  button.ctl.on { background: #e03131; border-color: #e03131; color: #fff; }
  button.ctl.undo { background: #f08c00; border-color: #f08c00; color: #111; font-weight: 700; }
  button.ctl:disabled { opacity: .35; cursor: default; }
  button.ctl svg { display: block; }
  #timeNum { font-size: 14px; font-weight: 600; }

  .menuwrap { position: relative; }
  #timeMenu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px;
    background: var(--bar);
    border: 1px solid #3a414b;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .6);
  }
  #timeMenu button.ctl { justify-content: flex-start; gap: 8px; height: 40px; padding: 0 12px; white-space: nowrap; }
  #timeMenu button.ctl.sel { background: var(--accent); border-color: var(--accent); color: #06121d; font-weight: 600; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    z-index: 30;
    max-width: 90vw;
    padding: 8px 14px;
    background: rgba(20, 22, 26, .95);
    border: 1px solid #3a414b;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<button class="panel" id="p1">
  <span class="name" id="n1">Weiß</span>
  <span class="time" id="t1">5:00</span>
  <span class="moves" id="m1">Züge: 0</span>
</button>

<div id="bar">
  <div class="menuwrap">
    <button class="ctl" id="timeBtn" title="Bedenkzeit wählen"><span id="timeIcon"></span><span id="timeNum">5</span></button>
    <div id="timeMenu" hidden></div>
  </div>
  <button class="ctl" id="swap" title="Weiß und Schwarz tauschen">⇄</button>
  <button class="ctl" id="pause" title="Pause" disabled>⏸</button>
  <button class="ctl" id="reset" title="Neue Partie">↺</button>
  <button class="ctl" id="mic" title="Sprachsteuerung">🎤</button>
  <button class="ctl undo" id="undoMate" title="Kein Schachmatt – weiterspielen" hidden>↩ ♚</button>
</div>

<button class="panel" id="p2">
  <span class="name" id="n2">Schwarz</span>
  <span class="time" id="t2">5:00</span>
  <span class="moves" id="m2">Züge: 0</span>
</button>

<div id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const panels = [$('p1'), $('p2')];
  const timeEls = [$('t1'), $('t2')];
  const moveEls = [$('m1'), $('m2')];
  const nameEls = [$('n1'), $('n2')];
  const pauseBtn = $('pause');
  const micBtn = $('mic');
  const swapBtn = $('swap');
  const undoBtn = $('undoMate');
  const timeBtn = $('timeBtn');
  const timeMenu = $('timeMenu');
  const toastEl = $('toast');

  // Symbole: Kugel (Bullet), Blitz, Uhr
  const BULLET = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g transform="rotate(45 12 12)"><path d="M8.5 22V10c0-3.5 1.6-6.3 3.5-8 1.900 1.700 3.500 4.500 3.500 8v12z" fill="#e8b130"/><rect x="8.500" y="17.500" width="7" height="4.500" fill="#9a6b12"/></g></svg>';
  const PRESETS = [
    { min: 1, icon: BULLET },
    { min: 3, icon: '⚡' },
    { min: 5, icon: '⚡' },
    { min: 10, icon: '⏱️' },
    { min: 30, icon: '⏱️' },
  ];
  // Ab wann die Zeit rot wird
  const WARN_MS = { 1: 10000, 3: 30000, 5: 30000, 10: 60000, 30: 60000 };

  let minutes = 5;
  let whiteIdx = 0;         // welche Uhr Weiß gehört
  let remaining = [0, 0];   // ms
  let moves = [0, 0];
  let warned = [false, false];
  let active = -1;          // -1 = noch nicht gestartet
  let paused = false;
  let finished = false;
  let winner = -1;
  let endReason = '';       // 'time' oder 'mate'
  let lastTick = 0;

  const nameOf = i => i === whiteIdx ? 'Weiß' : 'Schwarz';
  const warnMs = () => WARN_MS[minutes] || 30000;

  // ---------- Anzeige ----------
  function fmt(ms) {
    ms = Math.max(0, ms);
    if (ms < 10000) {
      const s = Math.floor(ms / 1000), d = Math.floor((ms % 1000) / 100);
      return `0:0${s}.${d}`;
    }
    const total = Math.ceil(ms / 1000);
    const m = Math.floor(total / 60), s = total % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function render() {
    const running = active !== -1 && !finished;
    for (let i = 0; i < 2; i++) {
      const lost = finished && endReason === 'time' && winner !== i;
      timeEls[i].textContent = fmt(remaining[i]);
      timeEls[i].classList.toggle('low', remaining[i] <= warnMs());
      moveEls[i].textContent = `Züge: ${moves[i]}`;
      nameEls[i].textContent = finished && winner === i ? `♚ ${nameOf(i)} gewinnt` : nameOf(i);
      panels[i].classList.toggle('white', i === whiteIdx);
      panels[i].classList.toggle('black', i !== whiteIdx);
      panels[i].classList.toggle('active', running && active === i && !paused);
      panels[i].classList.toggle('won', finished && winner === i);
      panels[i].classList.toggle('lost', lost);
      panels[i].classList.toggle('idle',
        (running && (paused || active !== i)) || (finished && endReason === 'mate' && winner !== i));
    }
    pauseBtn.disabled = !running;
    pauseBtn.textContent = paused ? '▶' : '⏸';
    swapBtn.disabled = active !== -1;
    undoBtn.hidden = !(finished && endReason === 'mate');
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3500);
  }

  // ---------- Ton ----------
  let audioCtx;
  function tone(freq, start, dur, vol = 0.2, type = 'sine') {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audioCtx.currentTime + start;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0);
      o.stop(t0 + dur);
    } catch (e) {}
  }
  const clickSound = () => tone(880, 0, 0.06, 0.15);
  // Kurzes Signal, wenn die Zeit knapp wird
  function lowTimeSound() {
    tone(1320, 0, 0.1, 0.22);
    tone(1320, 0.15, 0.1, 0.22);
  }
  // Zeit abgelaufen: absteigende Tonfolge, ca. 2 Sekunden
  function endSound() {
    tone(784, 0.0, 0.3, 0.28, 'triangle');
    tone(622, 0.3, 0.3, 0.28, 'triangle');
    tone(494, 0.6, 0.3, 0.28, 'triangle');
    tone(294, 0.9, 1.2, 0.32, 'triangle');
  }
  // Schachmatt: aufsteigende Tonfolge
  function mateSound() {
    tone(523, 0.0, 0.18, 0.25, 'triangle');
    tone(659, 0.18, 0.18, 0.25, 'triangle');
    tone(784, 0.36, 0.18, 0.25, 'triangle');
    tone(1047, 0.54, 0.7, 0.28, 'triangle');
  }

  // ---------- Uhr-Logik ----------
  function reset() {
    remaining = [minutes * 60000, minutes * 60000];
    moves = [0, 0];
    warned = [false, false];
    active = -1;
    paused = false;
    finished = false;
    winner = -1;
    endReason = '';
    render();
  }

  function tick(now) {
    if (active !== -1 && !paused && !finished) {
      remaining[active] -= now - lastTick;
      if (remaining[active] <= 0) {
        remaining[active] = 0;
        finished = true;
        winner = 1 - active;
        endReason = 'time';
        endSound();
      } else if (!warned[active] && remaining[active] <= warnMs()) {
        warned[active] = true;
        lowTimeSound();
      }
      render();
    }
    lastTick = now;
    requestAnimationFrame(tick);
  }

  // Uhr umschalten. "by" = Spieler, der gedrückt hat (0/1), oder undefined (Stimme/Leertaste)
  function switchClock(by) {
    if (finished || paused) return false;
    if (active === -1) {
      active = whiteIdx;                 // Weiß beginnt immer
    } else {
      if (by !== undefined && by !== active) return false; // nur der Spieler am Zug darf drücken
      moves[active]++;
      active = 1 - active;
    }
    lastTick = performance.now();
    clickSound();
    keepAwake();
    render();
    return true;
  }

  function togglePause() {
    if (active === -1 || finished) return;
    paused = !paused;
    lastTick = performance.now();
    render();
  }

  // Schachmatt: wer gerade am Zug ist (dessen Uhr läuft), gewinnt
  function declareMate() {
    if (active === -1 || finished || paused) return false;
    finished = true;
    winner = active;
    endReason = 'mate';
    mateSound();
    render();
    return true;
  }

  // Falsch erkanntes Schachmatt zurücknehmen und weiterspielen
  function undoMate() {
    if (!(finished && endReason === 'mate')) return;
    finished = false;
    winner = -1;
    endReason = '';
    lastTick = performance.now();
    render();
  }

  // ---------- Bedienung ----------
  panels.forEach((p, i) => p.addEventListener('click', () => switchClock(i)));

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) switchClock();
    } else if (e.key === 'p' || e.key === 'P') {
      togglePause();
    }
  });

  const gameRunning = () => active !== -1 && !finished;
  const confirmAbort = () => !gameRunning() || confirm('Laufende Partie abbrechen und neu starten?');

  // Zeit-Menü
  function updateTimeBtn() {
    const p = PRESETS.find(x => x.min === minutes);
    $('timeIcon').innerHTML = p.icon;
    $('timeNum').textContent = p.min;
    timeMenu.querySelectorAll('button').forEach(b => b.classList.toggle('sel', Number(b.dataset.min) === minutes));
  }
  PRESETS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'ctl';
    b.dataset.min = p.min;
    b.innerHTML = `<span>${p.icon}</span><span>${p.min} min</span>`;
    timeMenu.appendChild(b);
  });
  timeBtn.addEventListener('click', e => {
    e.stopPropagation();
    timeMenu.hidden = !timeMenu.hidden;
  });
  timeMenu.addEventListener('click', e => {
    e.stopPropagation();
    const b = e.target.closest('button[data-min]');
    if (!b) return;
    timeMenu.hidden = true;
    if (!confirmAbort()) return;
    minutes = Number(b.dataset.min);
    updateTimeBtn();
    reset();
  });
  // Tipp außerhalb schließt das Menü (und zählt dann nicht als Zug)
  document.addEventListener('click', e => {
    if (!timeMenu.hidden && !e.target.closest('.menuwrap')) {
      timeMenu.hidden = true;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  pauseBtn.addEventListener('click', togglePause);
  swapBtn.addEventListener('click', () => {
    if (active !== -1) return;
    whiteIdx = 1 - whiteIdx;
    render();
  });
  $('reset').addEventListener('click', () => { if (confirmAbort()) reset(); });
  undoBtn.addEventListener('click', undoMate);

  // Buttons sollen nach dem Klick nicht auf die Leertaste reagieren
  document.querySelectorAll('button').forEach(b => b.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') e.preventDefault();
  }));

  // Bildschirm wach halten (falls unterstützt)
  let wakeLock;
  async function keepAwake() {
    try {
      if (!wakeLock && navigator.wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }

  // ---------- Sprachsteuerung ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const KEYWORDS = /weiter|schach|stopp|stop/g;
  const MATE = /schach\s*matt|\bmatt\b/;
  let rec = null, micOn = false;
  let handled = {}, mateSeen = {}, lastVoice = 0, lastSwitch = null;

  function voiceTrigger(word, idx) {
    const now = performance.now();
    if (now - lastVoice < 700) return;      // Doppelauslösung verhindern
    const wasStart = active === -1;
    if (switchClock()) {
      lastVoice = now;
      lastSwitch = { idx, word, t: now, wasStart };
    }
  }

  function voiceMate(idx) {
    if (active === -1 || finished || paused) return;
    // "Schachmatt" kommt oft erst als "Schach" an und hat dann schon umgeschaltet:
    // dieses Umschalten zurücknehmen, damit der richtige Spieler gewinnt.
    const s = lastSwitch;
    if (s && s.idx === idx && s.word === 'schach' && !s.wasStart && performance.now() - s.t < 4000) {
      active = 1 - active;
      moves[active] = Math.max(0, moves[active] - 1);
    }
    lastSwitch = null;
    declareMate();
  }

  function startRec() {
    rec = new SR();
    rec.lang = 'de-DE';
    rec.continuous = true;
    rec.interimResults = true;   // Zwischenergebnisse = schnellere Reaktion
    handled = {}; mateSeen = {}; lastSwitch = null;

    rec.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const text = e.results[i][0].transcript.toLowerCase();
        if (MATE.test(text)) {
          if (!mateSeen[i]) { mateSeen[i] = true; voiceMate(i); }
          continue;
        }
        const hits = text.match(KEYWORDS) || [];
        if (hits.length > (handled[i] || 0)) {
          handled[i] = hits.length;
          voiceTrigger(hits[hits.length - 1], i);
        }
      }
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        micOn = false;
        updateMic();
        toast('Mikrofon-Zugriff wurde nicht erlaubt.');
      } else if (e.error === 'network') {
        toast('Spracherkennung braucht Internet.');
      }
    };
    rec.onend = () => {
      // Der Browser beendet die Erkennung nach Stille – einfach neu starten
      if (micOn) setTimeout(() => { if (micOn) { try { startRec(); } catch (e) {} } }, 150);
    };
    rec.start();
  }

  function updateMic() { micBtn.classList.toggle('on', micOn); }

  micBtn.addEventListener('click', () => {
    if (!SR) {
      toast('Spracherkennung geht nur in Chrome oder Edge.');
      return;
    }
    micOn = !micOn;
    if (micOn) {
      try { startRec(); }
      catch (e) { micOn = false; toast('Spracherkennung konnte nicht starten.'); }
    } else {
      try { rec && rec.stop(); } catch (e) {}
    }
    updateMic();
  });

  updateTimeBtn();
  reset();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
